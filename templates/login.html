{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh] px-4">
    <div class="w-full max-w-md bg-card border border-slate-700 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-300 to-amber-500"></div>

        <h2 class="text-3xl font-bold mb-2 text-center text-white">Welcome Back</h2>
        <p class="text-center text-slate-400 mb-8 text-sm">Please sign in to your student account</p>
        
        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2" for="email">
                    Email Address
                </label>
                <input type="email" name="email" id="email" required placeholder="name@student.ccis.edu.ph"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition placeholder-slate-600">
            </div>
            
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2" for="password">
                    Password
                </label>
                <input type="password" name="password" id="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition placeholder-slate-600">
            </div>
            
            <button class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-900 font-bold py-3 px-4 rounded-lg transition transform hover:-translate-y-0.5 shadow-lg shadow-yellow-500/20" type="submit">
                Sign In
            </button>
            
            <p class="text-center text-slate-500 text-sm mt-6">
                Don't have an account? <a href="{{ url_for('register') }}" class="text-primary hover:text-white font-medium transition">Register here</a>.
            </p>
        </form>
    </div>
</div>
{% endblock %}
