{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center py-12 px-4">
    <div class="w-full max-w-lg bg-card border border-slate-700 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-300 to-amber-500"></div>

        <h2 class="text-3xl font-bold mb-2 text-center text-white">Create Account</h2>
        <p class="text-center text-slate-400 mb-8 text-sm">Join the CCIS Complaint Management System</p>
        
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2">First Name</label>
                    <input type="text" name="firstName" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
                <div>
                    <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2">Last Name</label>
                    <input type="text" name="lastName" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
            </div>

            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2">
                    Student Number
                </label>
                <div class="relative">
                    <input type="text" name="student_number" required placeholder="e.g. 23-00951"
                        pattern="\d{2}-\d{5}" 
                        title="Format: XX-XXXXX (e.g., 23-00951)"
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition placeholder-slate-600">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
                        </svg>
                    </div>
                </div>
                <p class="text-xs text-slate-500 mt-1">Format: YY-XXXXX (Year - ID)</p>
            </div>

            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2">Email Address</label>
                <input type="email" name="email" required placeholder="name@student.ccis.edu.ph"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition placeholder-slate-600">
            </div>
            
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wide mb-2">Password</label>
                <input type="password" name="password" required placeholder="Create a strong password"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition placeholder-slate-600">
            </div>
            
            <button class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-900 font-bold py-3 px-4 rounded-lg transition transform hover:-translate-y-0.5 shadow-lg shadow-yellow-500/20 mt-2" type="submit">
                Create Account
            </button>
            
            <p class="text-center text-slate-500 text-sm mt-6">
                Already have an account? <a href="{{ url_for('login') }}" class="text-primary hover:text-white font-medium transition">Login here</a>.
            </p>
        </form>
    </div>
</div>
{% endblock %}
